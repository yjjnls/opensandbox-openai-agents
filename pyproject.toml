[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opensandbox-openai-agents"
version = "0.1.0"
description = "OpenSandbox sandbox provider for the OpenAI Agents SDK"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["sandbox", "opensandbox", "openai-agents", "agents", "code-execution"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "openai-agents>=0.24.0,<0.25.0",
    "opensandbox>=1.2.0,<2.0.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.urls]
Homepage = "https://github.com/yjjnls/opensandbox-openai-agents"
Issues = "https://github.com/yjjnls/opensandbox-openai-agents/issues"
OpenSandbox = "https://github.com/opensandbox-group/OpenSandbox"

[tool.hatch.build.targets.wheel]
packages = ["src/opensandbox_agents"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
